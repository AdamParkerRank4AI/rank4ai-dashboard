name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (clean, no cache)
        # npm install (not npm ci) so platform-specific rollup optional binary
        # gets resolved on Linux runners. npm ci respects lockfile-only and
        # hits https://github.com/npm/cli/issues/4828 ("Cannot find module
        # @rollup/rollup-linux-x64-gnu") on fresh checkouts.
        run: npm install --no-audit --no-fund

      - name: Build (current — rank4ai-dashboard)
        env:
          DASHBOARD: current
        run: npm run build

      - name: Deploy current → rank4ai-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          subject=$(printf '%s' "$COMMIT_SUBJECT" | head -n1)
          npx --yes wrangler@3 pages deploy ./dist \
            --project-name=rank4ai-dashboard \
            --branch=main \
            --commit-hash="${{ github.sha }}" \
            --commit-message="$subject"

      - name: Build (fleet — fleet-dashboard)
        env:
          DASHBOARD: fleet
        run: npm run build

      - name: Deploy fleet → fleet-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          subject=$(printf '%s' "$COMMIT_SUBJECT" | head -n1)
          npx --yes wrangler@3 pages deploy ./dist \
            --project-name=fleet-dashboard \
            --branch=main \
            --commit-hash="${{ github.sha }}" \
            --commit-message="$subject"
